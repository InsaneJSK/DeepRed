[project]
name = "deepred"
version = "0.1.0"
description = "RAM-aware autonomous navigation and gameplay for Pokemon Red using PyBoy"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "keyboard==0.13.5",
    "numpy==2.4.0",
    "pillow==12.1.0",
    "pyboy==2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
notebooks = ["ipykernel==7.2.0"]

[tool.uv]
package = false
# Preserve the SDL runtime used by the verified emulator baseline.
constraint-dependencies = ["pysdl2==0.9.17", "pysdl2-dll==2.32.0"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["pokered", "cloned", "status", "Pokemon_Red", "saves", "*.ipynb"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Standalone diagnostics add the project root before importing its modules.
"scratch/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires local game assets or a real emulator",
]
